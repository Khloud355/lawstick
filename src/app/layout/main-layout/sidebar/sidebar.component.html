<div class="sidebar">
  <h3 class="logo">LowStick</h3>

  <ul>
    <li routerLink="/admin/home" routerLinkActive="active">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M3 10L12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
      </svg>

      <a> الصفحة الرئيسية </a>
    </li>
    <li routerLink="/admin/tanents" routerLinkActive="active">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="9" cy="7" r="4" />
        <path d="M17 11v-1a4 4 0 0 0-3-3.87" />
        <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
      </svg>

      <a> المستأجرين </a>
    </li>
    <li routerLink="">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>

      <a> العقود </a>
    </li>
    <li routerLink="">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="12" y1="20" x2="12" y2="10" />
        <line x1="18" y1="20" x2="18" y2="4" />
        <line x1="6" y1="20" x2="6" y2="16" />
      </svg>

      <a> التقارير </a>
    </li>
    <li class="menu-item">
      <!-- Parent -->
      <div class="menu-link" (click)="toggleSettings()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1 a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3 a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1 a2 2 0 1 1 2.8-2.8l.1.1 a1.7 1.7 0 0 0 1.8.3h.2 a1.7 1.7 0 0 0 1-1.5V3 a2 2 0 1 1 4 0v.2 a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1 a2 2 0 1 1 2.8 2.8l-.1.1 a1.7 1.7 0 0 0-.3 1.8v.2 a1.7 1.7 0 0 0 1.5 1H21 a2 2 0 1 1 0 4h-.2 a1.7 1.7 0 0 0-1.5 1z"
          />
        </svg>

        <span>الإعدادات</span>

        <i class="arrow" [class.rotate]="isSettingsOpen"> ▼ </i>
      </div>

      <!-- Dropdown -->
      <ul class="submenu" *ngIf="isSettingsOpen">
        <li routerLink="/admin/setting" routerLinkActive="active-link">
          أنواع القضايا
        </li>

        <li routerLink="/admin/setting/users" routerLinkActive="active-link">
          إدارة المستخدمين
        </li>

        <li routerLink="/admin/setting/roles" routerLinkActive="active-link">
          الصلاحيات
        </li>
      </ul>
    </li>
  </ul>
</div>
